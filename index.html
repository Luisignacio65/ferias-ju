<style>
:root{
  --navy:#14304f; --teal:#2f9e8f; --graf:#3a4149; --muted:#6b7681;
  --line:#e2e7ec; --bg:#f6f8fa; --card:#ffffff; --amber:#c9862b; --red:#b4483d;
}
body.noche{
  --navy:#0c1f33; --teal:#2f9e8f; --graf:#e7edf3; --muted:#9aacbb;
  --line:#2a3948; --bg:#0f1720; --card:#182430; --amber:#d79a3f; --red:#e0655a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--graf);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.5; padding-bottom:200px;
  padding-bottom:calc(200px + env(safe-area-inset-bottom, 0px));
}
h1,h2,h3,h4{color:var(--navy); margin:0 0 8px}
h2{font-size:17px} h3{font-size:15px} h4{font-size:13.5px}
p{margin:6px 0}
button, .btn{
  font-family:inherit; font-size:14.5px; border:none; border-radius:10px;
  padding:12px 16px; cursor:pointer; background:var(--navy); color:#fff; font-weight:600;
}
button.sec{background:#fff; color:var(--navy); border:1.5px solid var(--line)}
body.noche button.sec{background:var(--card); color:var(--graf)}
button.teal{background:var(--teal); color:#06251f}
button.ghost{background:transparent; color:var(--muted); font-weight:500; padding:8px 10px}
button.danger{background:var(--red); color:#fff}
button:disabled{opacity:.45; cursor:default}
input, textarea, select{
  width:100%; font-family:inherit; font-size:14.5px; padding:10px 12px; border-radius:8px;
  border:1.5px solid var(--line); background:var(--card); color:var(--graf); margin:4px 0 10px;
}
textarea{min-height:56px; resize:vertical}
/* Objetivos por línea: el cuadro crece con el contenido (ver JS) — sin
   scroll interno ni asa de resize manual, que compitan con eso. */
textarea.objetivo-auto{overflow:hidden; resize:none; min-height:90px}
label.small{font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em}
.wrap{max-width:640px; margin:0 auto; padding:14px 14px 24px}
header.top{
  position:sticky; top:0; z-index:20; background:var(--navy); color:#fff;
  padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:8px;
}
header.top .brand{font-weight:800; font-size:15px}
header.top .brand small{display:block; font-weight:400; font-size:10.5px; color:#b9c7d6}
header.top .tools{display:flex; gap:6px; align-items:center}
header.top button.icon{
  background:rgba(255,255,255,.12); color:#fff; border-radius:8px; padding:8px 10px; font-size:13px;
}
.badge-net{font-size:10.5px; padding:3px 8px; border-radius:10px; font-weight:700}
.badge-net.on{background:var(--teal); color:#06251f}
.badge-net.off{background:var(--red); color:#fff}
.card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin:10px 0}
.card.big{padding:0; overflow:hidden}
.big-btn{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  width:100%; padding:26px 14px; border-radius:10px; font-size:15.5px;
}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.pill{display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:12px; color:#fff; margin:2px 4px 2px 0}
.pill.resuelto{background:var(--teal); color:#06251f}
.pill.pendiente{background:var(--amber)}
.pill.confuso{background:var(--red)}
.track{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0}
.track button{flex:1; min-width:90px; padding:9px 8px; font-size:12.5px}
.track button.sel{outline:3px solid var(--navy)}
.stepbar{display:flex; gap:4px; margin:4px 0 14px}
.stepbar div{flex:1; height:5px; border-radius:3px; background:var(--line)}
.stepbar div.done{background:var(--teal)}
.stepbar div.now{background:var(--navy)}
.thumbrow{display:flex; gap:8px; overflow-x:auto; padding:4px 0; touch-action:pan-x; overscroll-behavior-x:contain}
.thumb{position:relative; width:74px; height:74px; border-radius:8px; overflow:hidden; flex:none; border:1.5px solid var(--line)}
.thumb img{width:100%; height:100%; object-fit:cover}
.thumb .imp{position:absolute; top:2px; left:2px; background:var(--teal); color:#06251f; font-size:9px; font-weight:800; padding:1px 5px; border-radius:6px}
.tela-card{border:1px solid var(--line); border-radius:10px; padding:10px; margin:8px 0; background:var(--card)}
.tela-card .row{display:flex; gap:10px}
.tela-card .row img{width:64px; height:64px; object-fit:cover; border-radius:8px; flex:none}
.tela-card .fields{flex:1; min-width:0}
.tela-card .fields input{margin:3px 0}
.ctx-grid{display:flex; flex-wrap:wrap; gap:10px; margin:8px 0}
.thumb-ctx{width:104px}
.thumb-ctx img{width:104px; height:104px; object-fit:cover; border-radius:8px; border:1.5px solid var(--line); display:block}
.thumb-ctx input{font-size:11px; padding:5px 6px; margin:4px 0 0}
.thumb-ctx button{width:100%; margin-top:2px}
.navbar{
  position:fixed; bottom:0; left:0; right:0; background:var(--navy); display:flex;
  z-index:30; box-shadow:0 -2px 10px rgba(0,0,0,.2);
  /* FIX real del bug "el swipe lateral saca de la app": el causante no era
     solo el gesto de "volver atrás" de Safari — en el ícono de pantalla de
     inicio (modo standalone) iOS reserva una franja pegada al borde físico
     inferior para el gesto de "cambiar de app" (deslizar lateral en el
     borde), y ningún CSS puede vencer un gesto de sistema. Sin
     viewport-fit=cover en el <meta viewport> (ver <head>), env(safe-area-
     inset-bottom) siempre valía 0px, así que el menú quedaba pegado
     exactamente en esa franja. Con viewport-fit=cover, el inset real del
     iPhone (~34px en modelos con Face ID) sí se aplica, más 8px extra de
     colchón — los botones quedan por ENCIMA de la franja de gesto y dejan
     de competir con el sistema. */
  padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 8px);
  /* Con 10 pestañas ya no caben todas apretadas — en vez de encogerlas
     hasta ilegibles, se deja la barra desplazable horizontalmente (como
     un carrusel) y cada botón conserva un ancho mínimo cómodo de tocar. */
  overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  /* Además, dentro de la barra: que el deslizamiento lateral se interprete
     como scroll del menú y no como gesto de "volver atrás" del navegador. */
  touch-action:pan-x; overscroll-behavior-x:contain;
}
.navbar::-webkit-scrollbar{ display:none; }
.navbar::after{
  /* Sombra a la derecha para insinuar que hay más botones deslizando —
     sin esto, no es obvio a simple vista que la barra se puede correr. */
  content:''; position:absolute; top:0; right:0; bottom:0; width:22px;
  background:linear-gradient(to right, rgba(0,0,0,0), var(--navy));
  pointer-events:none;
}
.navbar button{
  flex:0 0 auto; min-width:74px; background:transparent; color:#b9c7d6; border-radius:0; padding:10px 6px; font-size:11px;
  display:flex; flex-direction:column; align-items:center; gap:2px; font-weight:600; white-space:nowrap;
}
.navbar button.active{color:#fff}
.navbar button .ic{font-size:18px}
.hidden{display:none !important}
body.kb-open .navbar{display:none}
/* Barra de Anterior/Siguiente/Guardar del asistente — arriba del paso, en el flujo
   normal de la página (no fija). Así nunca compite por espacio con el menú de
   abajo, sin importar el navegador ni el dispositivo. */
.wizard-nav{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:10px; margin:10px 0;
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
}
.wizard-nav.single{grid-template-columns:1fr}
.muted{color:var(--muted); font-size:12.5px}
.rec-dot{display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--red); margin-right:6px; animation:pulse 1s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.audio-row{display:flex; align-items:center; gap:8px; margin:6px 0}
table{width:100%; border-collapse:collapse; font-size:13px; margin:8px 0}
th,td{border:1px solid var(--line); padding:6px 8px; text-align:left}
th{background:var(--navy); color:#fff; font-size:11.5px}
.toast{
  position:fixed; bottom:84px; left:14px; right:14px; background:var(--graf); color:var(--bg);
  padding:12px 14px; border-radius:10px; font-size:13.5px; z-index:50; text-align:center;
}
.reg-item{border:1px solid var(--line); border-radius:10px; padding:12px; margin:8px 0; background:var(--card); cursor:pointer}
.reg-item:active{background:var(--bg)}
.reg-item .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
.checkbox-row{display:flex; align-items:center; gap:8px; margin:6px 0}
.checkbox-row input{width:auto; margin:0}
.alert-banner{background:var(--amber); color:#2a1c00; border-radius:10px; padding:10px 14px; margin:10px 0; font-size:13px; font-weight:600}
.grid-explica{display:grid; grid-template-columns:1fr; gap:8px; margin:8px 0}
.grid-explica .g{background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12.5px}
.grid-explica .g b{color:var(--navy); display:block; margin-bottom:2px; font-size:11.5px; text-transform:uppercase}
.confirm-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:60;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.confirm-box{background:var(--card); border-radius:12px; padding:18px; max-width:340px; width:100%}
.confirm-box p{margin:0 0 14px; font-size:14.5px; color:var(--graf)}
/* ---------- Lightbox: ampliar cualquier foto con un toque ----------
   Un solo overlay reutilizado para telas, prendas, fotos de contexto y
   comprobantes de gastos — evita duplicar el visor en cada pestaña. */
.lightbox-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:150;
  display:flex; align-items:center; justify-content:center; padding:18px;
}
.lightbox-overlay img{max-width:100%; max-height:100%; border-radius:6px; object-fit:contain}
.lightbox-close{
  position:absolute; top:16px; right:16px; background:rgba(255,255,255,.18); color:#fff;
  border:none; border-radius:50%; width:40px; height:40px; font-size:18px; line-height:40px;
}
img.zoomable{cursor:zoom-in}
/* ---------- Pantalla de clave de acceso ----------
   Cubre toda la app hasta que se ingrese la clave. Se pide una vez por
   sesión del navegador (no en cada cambio de pantalla dentro de la app). */
#lockScreen{
  position:fixed; inset:0; z-index:200; background:var(--navy);
  display:flex; align-items:center; justify-content:center; padding:20px;
}
#lockScreen .box{background:#fff; border-radius:14px; padding:26px 22px; max-width:320px; width:100%; text-align:center}
#lockScreen h2{margin:0 0 6px}
#lockScreen input{text-align:center; font-size:20px; letter-spacing:4px}
#lockScreen .err{color:var(--red); font-size:12.5px; margin-top:6px; display:none}
body:not(.unlocked) header.top, body:not(.unlocked) .wrap, body:not(.unlocked) .navbar{ display:none !important; }
body.unlocked #lockScreen{ display:none !important; }
</style>

/* ---------- Núcleo: capa de datos (IndexedDB con respaldo en memoria) ---------- */
var DB=null, DB_OK=false, MEM={ encuentros:[], visitas:[], gastos:[], planeacion:[], dossier:[] };

function openDB(cb){
  if(!('indexedDB' in window)){ toast("Este navegador no tiene almacenamiento local — se usará memoria temporal (exporta seguido)."); cb(); return; }
  var req = indexedDB.open("FeriasDB_v1", 4);
  req.onupgradeneeded = function(e){
    var db = e.target.result;
    if(!db.objectStoreNames.contains('encuentros')) db.createObjectStore('encuentros',{keyPath:'id'});
    if(!db.objectStoreNames.contains('visitas')) db.createObjectStore('visitas',{keyPath:'id'});
    if(!db.objectStoreNames.contains('gastos')) db.createObjectStore('gastos',{keyPath:'id'});
    if(!db.objectStoreNames.contains('planeacion')) db.createObjectStore('planeacion',{keyPath:'id'});
    if(!db.objectStoreNames.contains('dossier')) db.createObjectStore('dossier',{keyPath:'id'});
  };
  req.onsuccess = function(e){ DB=e.target.result; DB_OK=true; cb(); };
  req.onerror = function(){ toast("No se pudo abrir el almacenamiento local — usando memoria temporal."); cb(); };
}
function dbPut(store, obj, cb){
  if(DB_OK){
    try{
      var tx=DB.transaction(store,'readwrite'); tx.objectStore(store).put(obj);
      tx.oncomplete=function(){ cb&&cb(); };
      tx.onerror=function(){ toast("Error guardando — intenta de nuevo."); };
      return;
    }catch(e){}
  }
  var arr=MEM[store]; var idx=arr.findIndex(function(x){return x.id===obj.id;});
  if(idx>=0) arr[idx]=obj; else arr.push(obj);
  cb&&cb();
}
function dbGetAll(store, cb){
  if(DB_OK){
    try{
      var tx=DB.transaction(store,'readonly'); var req=tx.objectStore(store).getAll();
      req.onsuccess=function(){ cb(req.result||[]); };
      req.onerror=function(){ cb(MEM[store]||[]); };
      return;
    }catch(e){}
  }
  cb(MEM[store]||[]);
}
function dbDelete(store, id, cb){
  if(DB_OK){
    try{
      var tx=DB.transaction(store,'readwrite'); tx.objectStore(store).delete(id);
      tx.oncomplete=function(){ cb&&cb(); }; return;
    }catch(e){}
  }
  MEM[store]=(MEM[store]||[]).filter(function(x){return x.id!==id;});
  cb&&cb();
}

/* ---------- Compresión de imágenes (para no llenar el almacenamiento) ---------- */
function compressImage(file, cb){
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var maxW = 1000;
      var scale = Math.min(1, maxW/img.width);
      var canvas = document.createElement('canvas');
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      cb(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.onerror=function(){ cb(e.target.result); };
    img.src = e.target.result;
  };
  reader.onerror=function(){ toast("No se pudo leer la foto."); };
  reader.readAsDataURL(file);
}

/* ---------- Grabación de voz ---------- */
var REC = { mediaRecorder:null, chunks:[], stream:null };
function micDisponible(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); }
function startRec(onStop){
  if(!micDisponible()){ toast("Este navegador no soporta grabar audio aquí."); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    REC.stream = stream; REC.chunks=[];
    try{ REC.mediaRecorder = new MediaRecorder(stream); }
    catch(e){ toast("No se pudo iniciar la grabación."); return; }
    REC.mediaRecorder.ondataavailable = function(e){ if(e.data.size>0) REC.chunks.push(e.data); };
    REC.mediaRecorder.onstop = function(){
      var blob = new Blob(REC.chunks, {type:'audio/webm'});
      var reader = new FileReader();
      reader.onload=function(){ onStop(reader.result); };
      reader.readAsDataURL(blob);
      stream.getTracks().forEach(function(t){t.stop();});
    };
    REC.mediaRecorder.start();
  }).catch(function(){ toast("No se pudo acceder al micrófono (revisa permisos)."); });
}
function stopRec(){ if(REC.mediaRecorder && REC.mediaRecorder.state!=='inactive') REC.mediaRecorder.stop(); }

/* ---------- OCR opcional (solo si hay señal; nunca bloquea el flujo) ---------- */
var TESSERACT_LOADED=false;
/* ---------- Lectura de cabezotes de tela (Encuentro, paso Telas) ----------
   Best-effort igual que el OCR de comprobantes de Gastos: nunca bloquea, solo
   sugiere y Luis corrige. Rellena composición/ancho/GSM/precio SOLO si el
   campo está vacío — nunca pisa lo que ya haya escrito a mano. */
function extraerComposicionTela(texto){
  var comp = '\\d{1,3}\\s?%\\s?[A-Za-zÁÉÍÓÚáéíóúñÑ]+';
  var re = new RegExp('('+comp+'(?:[\\s\\+\\/,]{1,3}'+comp+')*)');
  var m = texto.match(re);
  return m? m[1].replace(/\s+/g,' ').trim() : '';
}
function extraerAnchoTela(texto){
  var m = texto.match(/(\d{2,3}(?:\/\d{2,3})?\s?(?:cm|"|in\b|inch))/i);
  return m? m[1].trim() : '';
}
function extraerGsmTela(texto){
  var m = texto.match(/(\d{2,4})\s?(?:gsm|g\/m2|g\/m²)/i);
  return m? m[1]+' GSM' : '';
}
function extraerPrecioTela(texto){
  var m = texto.match(/(?:US\$|USD|\$)\s?(\d{1,4}(?:[.,]\d{1,2})?)/i);
  return m? m[0].trim() : '';
}
function extraerCamposTela(texto){
  return {
    composicion: extraerComposicionTela(texto),
    ancho: extraerAnchoTela(texto),
    gsm: extraerGsmTela(texto),
    precio: extraerPrecioTela(texto)
  };
}
function intentarOCR(dataUrl, onDone){
  if(!navigator.onLine){ toast("Sin señal — escribe los datos a mano."); onDone(null); return; }
  function run(){
    toast("Leyendo cabezote…", 6000);
    Tesseract.recognize(dataUrl, 'eng').then(function(r){
      onDone(r && r.data ? r.data.text : null);
    }).catch(function(){ toast("No se pudo leer automáticamente."); onDone(null); });
  }
  if(window.Tesseract){ run(); return; }
  var s=document.createElement('script');
  s.src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js";
  s.onload=function(){ TESSERACT_LOADED=true; run(); };
  s.onerror=function(){ toast("Sin conexión al lector OCR — escribe los datos a mano."); onDone(null); };
  document.head.appendChild(s);
}

/* ---------- Lectura automática de comprobantes de gastos (OCR 100% local) ----------
   A diferencia del OCR de cabezotes de arriba (que se salta si no hay señal),
   este lee español + inglés + francés + chino simplificado, y el motor completo
   (librería + núcleo + datos de idioma) vive empacado en el sitio — funciona
   igual con o sin internet, una vez que el celular lo descargó la primera vez
   con wifi. Nunca bloquea el guardado manual: si algo falla, el formulario
   simplemente queda en blanco para completar a mano, como siempre. */
var TESS_GASTOS_LANGS = 'eng+spa+fra+chi_sim';
var TESS_GASTOS_WORKER = null;
var TESS_GASTOS_CARGANDO = null;

function obtenerWorkerGastos(cb){
  if(TESS_GASTOS_WORKER){ cb(TESS_GASTOS_WORKER); return; }
  if(TESS_GASTOS_CARGANDO){ TESS_GASTOS_CARGANDO.push(cb); return; }
  TESS_GASTOS_CARGANDO = [cb];
  function avisarTodos(w){
    var lista = TESS_GASTOS_CARGANDO; TESS_GASTOS_CARGANDO = null;
    lista.forEach(function(f){ f(w); });
  }
  function crear(){
    Tesseract.createWorker({
      workerPath: './worker.min.js',
      corePath: './tesseract-core.js',
      langPath: './',
      gzip: false,
      workerBlobURL: false,
      logger: function(){}
    }).then(function(w){
      return w.loadLanguage(TESS_GASTOS_LANGS).then(function(){ return w.initialize(TESS_GASTOS_LANGS); }).then(function(){ return w; });
    }).then(function(w){ TESS_GASTOS_WORKER = w; avisarTodos(w); })
      .catch(function(){ avisarTodos(null); });
  }
  if(window.Tesseract){ crear(); return; }
  var s = document.createElement('script');
  s.src = './tesseract.min.js';
  s.onload = crear;
  s.onerror = function(){ avisarTodos(null); };
  document.head.appendChild(s);
}

function leerComprobanteGasto(dataUrl, onDone){
  obtenerWorkerGastos(function(worker){
    if(!worker){ onDone(null); return; }
    worker.recognize(dataUrl).then(function(r){
      var texto = (r && r.data && r.data.text) || '';
      onDone(extraerCamposComprobante(texto));
    }).catch(function(){ onDone(null); });
  });
}

function mesDesdeTexto(s){
  s = (s||'').toLowerCase().replace(/[. ]/g,'').trim();
  if(MESES_TEXTO[s]!=null) return MESES_TEXTO[s];
  // probar por las 3 primeras letras (cubre abreviaturas no listadas tal cual)
  var corto = s.slice(0,3);
  if(MESES_TEXTO[corto]!=null) return MESES_TEXTO[corto];

/* Grupos de día/mes reutilizados en todos los patrones de fecha de abajo.
   IMPORTANTE: el orden de las alternativas importa — una alternación regex
   toma la PRIMERA opción que calce, no la más larga. Con "día 30" y el orden
   viejo (0?[1-9] primero), el motor aceptaba solo el "3" y dejaba el "0"
   suelto siempre que no hubiera un separador obligatorio justo después que
   forzara a reintentar — pasaba exactamente eso en el patrón año-mes-día (el
   día es el último grupo, sin nada obligatorio detrás). Bug real, confirmado
   con una factura real del 30 de mayo que la app leyó como "3 de mayo".
   Iguales para el mes en 10/11/12. Iguales para el mes en 10/11/12. */
var DIA_RE = '(3[01]|[12]\\d|0?[1-9])';
var MES_RE = '(1[0-2]|0?[1-9])';
function detectarFechaComprobante(texto){
  var m = texto.match(new RegExp('(20\\d{2})[-\\/.]'+MES_RE+'[-\\/.]'+DIA_RE));
  if(m) return {texto:m[1]+'-'+pad2(m[2])+'-'+pad2(m[3]), rango:[m.index,m.index+m[0].length]};
  m = texto.match(new RegExp('(20\\d{2})\\s*年\\s*'+MES_RE+'\\s*月\\s*'+DIA_RE+'\\s*日'));
  if(m) return {texto:m[1]+'-'+pad2(m[2])+'-'+pad2(m[3]), rango:[m.index,m.index+m[0].length]};
  // "13 Aug 2026" / "Aug 13, 2026" / "13 agosto 2026" / "13 août 2026"
  m = texto.match(new RegExp(DIA_RE+'\\s+([A-Za-zÀ-ÿ.]{3,12})\\.?\\s*,?\\s+(20\\d{2})'));
  if(m){ var mm = mesDesdeTexto(m[2]); if(mm) return {texto:m[3]+'-'+pad2(mm)+'-'+pad2(m[1]), rango:[m.index,m.index+m[0].length]}; }
  m = texto.match(new RegExp('([A-Za-zÀ-ÿ.]{3,12})\\.?\\s+'+DIA_RE+',?\\s+(20\\d{2})'));
  if(m){ var mm2 = mesDesdeTexto(m[1]); if(mm2) return {texto:m[3]+'-'+pad2(mm2)+'-'+pad2(m[2]), rango:[m.index,m.index+m[0].length]}; }
  m = texto.match(new RegExp(DIA_RE+'[-\\/.]'+MES_RE+'[-\\/.](20\\d{2})'));
  if(m) return {texto:m[3]+'-'+pad2(m[2])+'-'+pad2(m[1]), rango:[m.index,m.index+m[0].length]};
  m = texto.match(new RegExp(DIA_RE+'[-\\/.]'+MES_RE+'[-\\/.](\\d{2})\\b'));
  if(m){ var yy=parseInt(m[3],10); var yyyy=(yy<50? 2000+yy : 1900+yy); return {texto:yyyy+'-'+pad2(m[2])+'-'+pad2(m[1]), rango:[m.index,m.index+m[0].length]}; }
  return {texto:'', rango:null};
}
function normalizarNumeroComprobante(s){
  s = s.replace(/[^\d.,]/g,'');
  if(!s) return null;
  var lastComma = s.lastIndexOf(','), lastDot = s.lastIndexOf('.');
  if(lastComma>-1 && lastDot>-1){
    if(lastComma>lastDot) s = s.replace(/\./g,'').replace(',','.');
    else s = s.replace(/,/g,'');
  } else if(lastComma>-1){
    var trasC = s.length-lastComma-1;
    if(trasC===2) s = s.replace(',','.'); else s = s.replace(/,/g,'');
  } else if(lastDot>-1){
    var partes = s.split('.');
    var trasP = partes[partes.length-1].length;
    if(partes.length>2 || trasP===3) s = s.replace(/\./g,'');
  }
  var val = parseFloat(s);
  return isNaN(val)? null : val;
}
function extraerNumeroDeLineaComprobante(linea){
  // El (?:[.,]\s?\d{3})* tolera un espacio suelto después de la coma/punto
  // (típico ruido de OCR en montos grandes, ej. "167, 000" en vez de
  // "167,000") — sin el \s? opcional, esos dos trozos se leían como números
  // separados (167 y 000) y el total real nunca aparecía como candidato.
  var re = /\d{1,3}(?:[.,]\s?\d{3})*(?:[.,]\s?\d{1,2})?/g;
  var m, mejor=null;
  while((m=re.exec(linea))){
    var n = normalizarNumeroComprobante(m[0]);
    if(n!=null && (mejor==null || n>mejor)) mejor=n;
  }
  return mejor;
}
var PALABRAS_TOTAL_GASTO = ['total a pagar','total general','grand total','montant total','montant ttc','total ttc','总计','合计','amount due','import total','valor total','total'];
/* rangoFecha (opcional): posición [inicio,fin] donde ya se detectó la fecha en
   el texto completo — se descarta esa porción antes de buscar el monto, para
   que un año/día de la fecha (ej. "2026") no se cuele como si fuera el valor
   del gasto cuando el comprobante no dice "total" en ningún lado (bug real
   confirmado: un recibo chino sin la palabra total devolvía el año como
   monto). */
function detectarMontoComprobante(texto, rangoFecha){
  var textoSinFecha = texto;
  if(rangoFecha){
    textoSinFecha = texto.slice(0,rangoFecha[0]) + ' '.repeat(rangoFecha[1]-rangoFecha[0]) + texto.slice(rangoFecha[1]);
  }
  var lineas = textoSinFecha.split('\n');
  for(var i=0;i<lineas.length;i++){
    // Se compara sin espacios: encabezados de total suelen imprimirse con
    // letras separadas para resaltar ("T O T A L") y el OCR las lee tal cual
    // — comparando "totalapagar" contra la palabra sin espacios sí calza
    // (bug real confirmado: una factura con "T O T A L .... $167,000" no
    // encontraba la palabra "total" y terminaba tomando otro número más
    // pequeño de la factura).
    var lineaCompacta = lineas[i].toLowerCase().replace(/\s+/g,'');
    for(var j=0;j<PALABRAS_TOTAL_GASTO.length;j++){
      if(lineaCompacta.indexOf(PALABRAS_TOTAL_GASTO[j].replace(/\s+/g,''))>=0){
        var num = extraerNumeroDeLineaComprobante(lineas[i]);
        if(num!=null) return num;
      }
    }
  }
  var candidatos = [];
  var re = /\d{1,3}(?:[.,]\s?\d{3})*(?:[.,]\s?\d{1,2})?/g, m;
  while((m=re.exec(textoSinFecha))){
    var n = normalizarNumeroComprobante(m[0]);
    // Se descartan números "año" sueltos (2015-2035 sin decimales) — casi
    // siempre son restos de una fecha que el patrón de arriba no capturó
    // completa, no el valor del gasto.
    if(n!=null && n>=2015 && n<=2035 && m[0].indexOf('.')<0 && m[0].indexOf(',')<0) continue;
    if(n!=null && n>0 && n<10000000) candidatos.push(n);
  }
  if(!candidatos.length) return null;
  candidatos.sort(function(a,b){return b-a;});
  return candidatos[0];
}
/* Colapsa espacios que Tesseract mete entre caracteres chinos/japoneses
   sueltos (ej. "上 海 国际" en vez de "上海国际") — de otro modo el nombre
   del negocio en chino queda con espacios raros al copiarlo al campo. */
function limpiarEspaciosCJK(s){
  return (s||'').replace(/([一-鿿])\s+(?=[一-鿿])/g,'$1');
}
/* Corta lo que venga después de un NIT/RUC/identificación tributaria QUE
   APAREZCA DENTRO de la línea del nombre — no solo cuando la línea EMPIEZA
   así. Caso real confirmado: "ALMACENES EXITO S.A NIT 8909006089" traía
   pegado el NIT al nombre real del negocio. */
var RE_CORTAR_TAX_ID = /\s+(nit|ruc|rut)[\s:.\/]*\d.*$/i;
/* Una línea sin ninguna "palabra real" (racha de al menos 4 letras seguidas)
   casi nunca es el nombre del negocio — normalmente es ruido de OCR sobre un
   logo o encabezado decorativo. Caso real confirmado: un logo mal leído como
   "cL SI FA NO DI NO" (puros tokens de 1-2 letras) se coló como beneficiario
   antes de esta regla, dejando pasar de largo el nombre real más abajo. */
var RE_TIENE_PALABRA_REAL = /[A-Za-zÀ-ÿ一-鿿]{4,}/;
function detectarBeneficiarioComprobante(texto){
  var lineas = texto.split('\n').map(function(l){return limpiarEspaciosCJK(l.trim());}).filter(Boolean);
  var candidatas = [];
  for(var i=0;i<Math.min(lineas.length,10);i++){
    var l = lineas[i];
    if(l.length<2 || l.length>60) continue;
    if(LINEAS_IGNORAR_BENEFICIARIO.test(l)) continue;
    if(/^[\d\s\-\/.:]+$/.test(l)) continue;
    // Una línea con más de ~35% de dígitos casi nunca es el nombre del
    // negocio (número de factura, NIT, teléfono, dirección con nomenclatura,
    // aunque no haya calzado con ninguna de las palabras de la lista de
    // arriba) — confirmado con pruebas reales antes de este cambio.
    if(proporcionDigitos(l) > 0.35) continue;
    if(!RE_TIENE_PALABRA_REAL.test(l)) continue;
    candidatas.push({linea:l.replace(RE_CORTAR_TAX_ID,''), indice:i});
  }
  if(!candidatas.length) return '';
  // Entre las candidatas que pasaron el filtro, se prefiere la más cercana
  // al inicio del comprobante (ahí suele ir el nombre del negocio); en caso
  // de empate de posición no hay más criterio que ese orden.
  return candidatas[0].linea;
}
function detectarCiudadComprobante(texto){
  for(var i=0;i<CIUDADES_CONOCIDAS_GASTO.length;i++){
    if(CIUDADES_CONOCIDAS_GASTO[i].re.test(texto)) return CIUDADES_CONOCIDAS_GASTO[i].nombre;
  }
  return '';
}
function detectarConceptoComprobante(texto){
  for(var i=0;i<CONCEPTO_PATRONES_GASTO.length;i++){
    if(CONCEPTO_PATRONES_GASTO[i].re.test(texto)) return CONCEPTO_PATRONES_GASTO[i].concepto;
  }
  return '';
}
var RE_EFECTIVO_COMPROBANTE = /\befectivo\b|\bcash\b|esp[eè]ces|现金|contado/i;
var RE_TARJETA_COMPROBANTE = /tarjeta|\bvisa\b|mastercard|amex|american express|d[ée]bito|cr[ée]dito|credit card|debit card|carte bancaire|信用卡|刷卡|银行卡/i;
function detectarMetodoPagoComprobante(texto){
  // El efectivo es la excepción (la mayoría de los gastos son con tarjeta),
  // así que solo se marca cuando el comprobante lo dice explícitamente.
  if(RE_EFECTIVO_COMPROBANTE.test(texto)) return 'Efectivo';
  if(RE_TARJETA_COMPROBANTE.test(texto)) return 'Tarjeta';
  return '';
}
function extraerCamposComprobante(texto){
  var fechaInfo = detectarFechaComprobante(texto);
  return {
    fecha: fechaInfo.texto,
    monto: detectarMontoComprobante(texto, fechaInfo.rango),
    beneficiario: detectarBeneficiarioComprobante(texto),
    ciudad: detectarCiudadComprobante(texto),
    concepto: detectarConceptoComprobante(texto),
    metodoPago: detectarMetodoPagoComprobante(texto),
    texto_ocr: texto
  };
}

/* ---------- Fotos de contexto (stand, pabellón, persona de contacto, tarjeta, etc.) ----------
   Distintas de las fotos de producto (telas/prendas, que ya soportan varias
   fotos una por referencia). Aquí se guardan fotos libres con una etiqueta que
   tú escribes — sin categorías fijas, para que sirva para cualquier cosa que
   quieras registrar (stand, pabellón, persona de contacto, tarjeta de
   presentación, etc.). Función compartida entre Encuentro y Visita al Mercado. */
function migrarFotoAvisoUnica(v){
  /* Compatibilidad con visitas guardadas antes de este cambio, que solo tenían
     una foto (foto_aviso) — se pasa a la galería nueva sin perderla. */
  if(v && v.foto_aviso && (!v.fotos_contexto || !v.fotos_contexto.length)){
    v.fotos_contexto = [{id:uid(), etiqueta:'Aviso / vitrina', foto:v.foto_aviso}];
  }
  if(v && !v.fotos_contexto) v.fotos_contexto = [];
}
/* ---------- Compatibilidad Módulo 4 — Muestras ----------
   Los encuentros guardados antes de este módulo no traen el campo `muestra`
   en cada tela ni `alta_estado`/`alta_fecha` en onboarding. Se completan al
   vuelo, sin tocar nada de lo ya capturado. */
function migrarMuestra(t){
  if(!t.muestra) t.muestra = {estado:'pendiente', linea:'', origen:'envio_proveedor', precio_confirmado:false,
    dueno_nombre:'', dueno_linea:'', fecha_recepcion:null, fecha_entrega:null, contexto:''};
  if(!t.muestra.origen) t.muestra.origen = 'envio_proveedor';
}
function migrarOnboardingAlta(e){
  if(!e.onboarding) e.onboarding = {qr_mostrado:false, courier_entregado:false, alta_estado:'', alta_fecha:null};
  if(e.onboarding.alta_estado===undefined) e.onboarding.alta_estado='';
  if(e.onboarding.alta_fecha===undefined) e.onboarding.alta_fecha=null;
}
function viewFotosContexto(lista, idFileInput, placeholderEtiqueta, tituloCampo){
  var items = (lista||[]).map(function(f,i){
    return '<div class="thumb-ctx" data-ictx="'+i+'">'+
      '<img class="zoomable" src="'+f.foto+'">'+
      '<input data-etictx="'+i+'" placeholder="'+escapeHtml(placeholderEtiqueta||'Ej: Stand, Pabellón, Contacto...')+'" value="'+escapeHtml(f.etiqueta||'')+'">'+
      '<button class="ghost danger" data-delctx="'+i+'" style="font-size:11px;padding:4px 6px">🗑️ Quitar</button>'+
    '</div>';
  }).join('');
  return ''+
    '<label class="small">'+(tituloCampo||'Fotos adicionales (stand, pabellón, persona de contacto, tarjeta, etc.)')+'</label>'+
    '<input type="file" accept="image/*" capture="environment" id="'+idFileInput+'">'+
    (items? '<div class="ctx-grid">'+items+'</div>' : '<p class="muted" style="font-size:11.5px">Sin fotos adicionales todavía.</p>');
}
function wireFotosContexto(lista, idFileInput, onChange){
  var f = document.getElementById(idFileInput);
  if(f) f.onchange = function(){
    if(!f.files || !f.files[0]) return;
    compressImage(f.files[0], function(dataUrl){
      lista.push({id:uid(), etiqueta:'', foto:dataUrl});
      onChange();
    });
  };
  document.querySelectorAll('[data-etictx]').forEach(function(inp){
    inp.oninput = function(){ lista[+inp.getAttribute('data-etictx')].etiqueta = inp.value; };
  });
  document.querySelectorAll('[data-delctx]').forEach(function(b){
    b.onclick = function(){ lista.splice(+b.getAttribute('data-delctx'),1); onChange(); };
  });
}

/* ---------- Autoguardado de borrador ----------
   Los comentarios y campos NO esperan al botón "Guardar" del paso 5/4 — se
   escriben a la base local (IndexedDB) apenas hay algo que valga la pena
   conservar. Así, si el celular descarga la app en segundo plano (cambio de
   app, bloqueo de pantalla, etc.) y se pierde la memoria en curso, lo escrito
   ya quedó guardado y se recupera solo al reabrir. */
function autoguardarBorrador(){
  if(STATE.view==='encuentro' && STATE.enc && (STATE.encStep>0 || STATE.enc.proveedor.trim())){
    STATE.enc.fecha_edicion = Date.now();
    STATE.enc._paso = STATE.encStep; // para retomar en el mismo paso si la app se recarga
    dbPut('encuentros', STATE.enc);
  }
  if(STATE.view==='almacen' && STATE.vis && (STATE.visStep>0 || STATE.vis.marca.trim())){
    STATE.vis.fecha_edicion = Date.now();
    STATE.vis._paso = STATE.visStep;
    dbPut('visitas', STATE.vis);
  }
}

/* ---------- Render principal ---------- */
function render(){
  var app = document.getElementById('app');
  document.querySelectorAll('.navbar button').forEach(function(b){
    b.classList.toggle('active', b.dataset.view===STATE.view);
  });
  if(STATE.view==='home') app.innerHTML = viewHome();
  else if(STATE.view==='objetivos') renderObjetivos(app);
  else if(STATE.view==='planeacion') renderPlaneacion(app);
  else if(STATE.view==='dossier') renderDossier(app);
  else if(STATE.view==='encuentro') app.innerHTML = viewEncuentro();
  else if(STATE.view==='almacen') app.innerHTML = viewAlmacen();
  else if(STATE.view==='registros') renderRegistros(app);
  else if(STATE.view==='seguimiento') renderSeguimiento(app);
  else if(STATE.view==='muestras') renderMuestras(app);
  else if(STATE.view==='gastos') renderGastos(app);
  else if(STATE.view==='reporte') renderReporte(app);
  wireView();
  autoguardarBorrador();
}

/* ---------- Cierre del encuentro (Paso 3 de 3) ----------
   Combina lo que antes eran 3 pasos separados (Ficha de Encuentro, Lo nuevo,
   Cierre) en uno solo, rápido de repasar antes de guardar: selección del
   stand (automática), temas tratados (opcionales, ya no bloquean el avance),
   notas/pendientes libres, y el registro OEA si el proveedor es nuevo. */
function stepCierre(e){
  var seleccion = e.telas.filter(function(t){return t.importante;});
  var seleccionHtml = ''+
  '<div class="card">'+
    '<h3>Listado Selección Stand</h3>'+
    (seleccion.length? seleccion.map(function(t){return '<p>★ '+escapeHtml(t.ref||'(sin referencia)')+' — '+escapeHtml(t.composicion||'')+'</p>';}).join('') : '<p class="muted">Ninguna tela marcada como importante todavía — vuelve al paso anterior y toca ☆ en las que quieras destacar.</p>')+
  '</div>';
  var oeaHtml = '';
  if(e.proveedor_nuevo){
    oeaHtml = '<div class="card">'+
      '<h3>Registro proveedor nuevo (OEA)</h3>'+
      '<div class="checkbox-row"><input type="checkbox" id="fQr2" '+(e.onboarding.qr_mostrado?'checked':'')+'> Mostrar QR de alta (OEA)</div>'+
      '<div class="checkbox-row"><input type="checkbox" id="fCourier2" '+(e.onboarding.courier_entregado?'checked':'')+'> Entregar N° de courier</div>'+
      '<label class="small">Estado del alta</label>'+
      '<select id="fAltaEstado2">'+
        '<option value="en_alta" '+(e.onboarding.alta_estado!=='completada'?'selected':'')+'>En alta</option>'+
        '<option value="completada" '+(e.onboarding.alta_estado==='completada'?'selected':'')+'>Completada</option>'+
      '</select>'+

  }
  var temasHtml = '<div class="card" style="background:transparent;box-shadow:none;padding:0 0 4px"><p class="muted" style="font-size:11.5px">Temas tratados — opcional, solo si surgió en la conversación.</p></div>'+stepA2(e);
  var pendientesHtml = ''+
    '<div class="card"><label class="small">Notas del encuentro</label><textarea id="fHallazgos" placeholder="Hallazgos, novedades del proveedor...">'+escapeHtml(e.hallazgos_stand)+'</textarea></div>'+
    '<div class="card"><label class="small">Pendientes y tareas (tuyas y del proveedor)</label><textarea id="fOtros" placeholder="Ej: precios por confirmar, desarrollos, muestras a enviar...">'+escapeHtml(e.otros_pendientes)+'</textarea></div>';
  return seleccionHtml+oeaHtml+temasHtml+pendientesHtml+

}

/* ---------- Vista: Visita a almacén ---------- */
function viewAlmacen(){
  if(!STATE.vis) STATE.vis = nuevaVisita();
  var v = STATE.vis;
  var steps=['Marca y ubicación','Prendas clave','Enviar','Guardar'];
  var bar = '<div class="stepbar">'+steps.map(function(s,i){
    return '<div class="'+(i<STATE.visStep?'done':(i===STATE.visStep?'now':''))+'"></div>';
  }).join('')+'</div>';
  var nav = '<div class="wizard-nav'+(STATE.visStep===0?' single':'')+'">'+
      (STATE.visStep>0? '<button class="sec" id="bAtras">← Atrás</button>' : '')+
      (STATE.visStep<3? '<button id="bSig">Siguiente →</button>' : '<button class="teal" id="bGuardar">✓ Guardar visita</button>')+
    '</div>';
  var body='';
  if(STATE.visStep===0) body = stepB1(v);
  else if(STATE.visStep===1) body = stepB2(v);
  else if(STATE.visStep===2) body = stepB3(v);
  else body = stepB4(v);
  return '<h2>Ver el mercado</h2>'+
    '<p class="muted">Paso '+(STATE.visStep+1)+' de 4 — '+steps[STATE.visStep]+'</p>'+bar+nav+body;
}

/* ---------- Seguimiento (Módulo 5) ---------- */
function generarCorreoTexto(e){
  var pend = [];
  ['programa','comisiones','reclamos','desarrollos'].forEach(function(k){
    var d = e.temas[k];
    if(d.resultado==='Pendiente' || d.resultado==='Respuesta poco clara'){
      pend.push(TEMA_LABELS[k]+': '+(d.comentario||d.resumen||'pls advise status'));
    }
  });
  if(e.pedido_nuevo) pend.push('Order discussed at the fair: '+e.pedido_nuevo);
  if(e.otros_pendientes) pend.push(e.otros_pendientes);
  var info = EMAIL_PROVEEDORES[e.proveedor] || {email:'', contacto:''};
  var saludo = info.contacto ? info.contacto : 'Sirs';
  var body = 'Dear '+saludo+',\n\n'+
    'Tks for the meeting at the fair. Following up on a few points from our conversation:\n\n'+
    pend.map(function(p){return '- '+p;}).join('\n')+
    '\n\nPls cfrm asap.\n\nBest rgds,\nLuis';
  return { subject:'Follow-up - '+e.proveedor+' (trade fair)', body:body, email:info.email };
}
function pendientesDe(e){
  var items = [];
  ['programa','comisiones','reclamos','desarrollos'].forEach(function(k){
    var d = e.temas[k];
    if(d.resultado==='Pendiente' || d.resultado==='Respuesta poco clara'){
      items.push({label:TEMA_LABELS[k], resultado:d.resultado, texto:d.comentario||d.resumen||''});
    }
  });
  return items;
}
function renderSeguimiento(app){
  app.innerHTML = '<h2>Seguimiento</h2><p class="muted">Temas pendientes o con respuesta poco clara, y compromisos sueltos del encuentro.</p><div id="segBody"><p class="muted">Cargando…</p></div>';
  dbGetAll('encuentros', function(all){
    var el = document.getElementById('segBody');
    if(STATE.correoId){
      var e = all.find(function(x){return x.id===STATE.correoId;});
      if(!e){ STATE.correoId=null; renderSeguimiento(app); return; }
      el.innerHTML = ''+
        '<div class="card">'+
          '<h3>Correo de seguimiento — '+escapeHtml(e.proveedor)+'</h3>'+
          (STATE.correoEmail? '<p class="muted">Para: '+escapeHtml(STATE.correoEmail)+'</p>' : '<p class="muted">Sin email registrado para este proveedor — complétalo a mano.</p>')+
          '<label class="small">Asunto</label><input id="fCorreoAsunto" value="'+escapeHtml(STATE.correoAsunto)+'">'+
          '<label class="small">Cuerpo</label><textarea id="fCorreoCuerpo" style="min-height:180px">'+escapeHtml(STATE.correoCuerpo)+'</textarea>'+
          '<div class="grid2">'+
            '<button id="btnCopiarCorreo">📋 Copiar</button>'+
            '<a class="btn" style="display:block;text-align:center;text-decoration:none" id="btnAbrirCorreo" href="#">✉️ Abrir en tu correo</a>'+
          '</div>'+
          '<button class="ghost" id="btnVolverSeg" style="margin-top:6px">← Volver al listado</button>'+
        '</div>';
      /* Se cablea aquí mismo, no en wireSeguimiento(): en este punto los elementos
         ya existen de verdad en el DOM (se acaban de insertar arriba). */
      var taC = document.getElementById('fCorreoCuerpo');
      if(taC) taC.oninput = function(){ STATE.correoCuerpo = taC.value; };
      var iaC = document.getElementById('fCorreoAsunto');
      if(iaC) iaC.oninput = function(){ STATE.correoAsunto = iaC.value; };
      var linkAbrir = document.getElementById('btnAbrirCorreo');
      if(linkAbrir){
        linkAbrir.href = 'mailto:'+encodeURIComponent(STATE.correoEmail||'')+'?subject='+encodeURIComponent(STATE.correoAsunto)+'&body='+encodeURIComponent(STATE.correoCuerpo);
      }
      var btnCop = document.getElementById('btnCopiarCorreo');
      if(btnCop) btnCop.onclick = function(){
        var texto = STATE.correoAsunto+'\n\n'+STATE.correoCuerpo;
        function fallback(){
          var tmp = document.createElement('textarea'); tmp.value = texto;
          tmp.style.position='fixed'; tmp.style.opacity='0'; document.body.appendChild(tmp);
          tmp.focus(); tmp.select();
          try{ document.execCommand('copy'); toast('Correo copiado ✓'); }
          catch(err){ toast('No se pudo copiar automáticamente — selecciona el texto a mano.'); }
          document.body.removeChild(tmp);
        }
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(texto).then(function(){ toast('Correo copiado ✓'); }).catch(fallback);
        } else fallback();
      };
      return;
    }
    var pendientes = all.filter(function(e){ return pendientesDe(e).length>0 || e.pedido_nuevo || e.otros_pendientes; });
    pendientes.sort(function(a,b){return b.fecha_edicion-a.fecha_edicion;});
    var pendHtml = !pendientes.length? '<p class="muted">Sin pendientes abiertos — todo al día.</p>' : pendientes.map(function(e){
      var items = pendientesDe(e);
      var pillsHtml = items.map(function(it){
        var cls = it.resultado==='Pendiente'?'pendiente':'confuso';
        return '<p><span class="pill '+cls+'">'+it.label+'</span> '+escapeHtml(it.texto)+'</p>';
      }).join('');
      var extra = '';
      if(e.pedido_nuevo) extra += '<p class="muted">Pedido en el stand: '+escapeHtml(e.pedido_nuevo)+'</p>';
      if(e.otros_pendientes) extra += '<p class="muted">Otros pendientes: '+escapeHtml(e.otros_pendientes)+'</p>';
      var info = EMAIL_PROVEEDORES[e.proveedor]||{email:''};
      return '<div class="card">'+
        '<div class="top" style="display:flex;justify-content:space-between"><strong>'+escapeHtml(e.proveedor)+'</strong><span class="muted">'+fmtFecha(e.fecha_edicion)+'</span></div>'+
        pillsHtml+extra+
        (info.email? '' : '<p class="muted" style="font-size:11px">⚠️ Sin email en la planilla de proveedores.</p>')+
        '<button data-correo="'+e.id+'">✉️ Generar correo</button>'+
      '</div>';
    }).join('');
    var nuevos = all.filter(function(e){ migrarOnboardingAlta(e); return e.proveedor_nuevo && e.onboarding.qr_mostrado; });
    var oeaHtml = '<h3 style="margin-top:22px">Alta OEA — proveedores nuevos</h3>'+
      (nuevos.length? nuevos.map(function(e){
        return '<div class="card">'+
          '<div style="display:flex;justify-content:space-between"><strong>'+escapeHtml(e.proveedor)+'</strong><span class="muted">'+escapeHtml(e.proveedor_linea||'')+'</span></div>'+
          (e.onboarding.courier_entregado? '<p class="muted" style="font-size:11.5px">N° de courier entregado'+(e.onboarding.courier_fecha? ' — '+fmtFecha(e.onboarding.courier_fecha):'')+'</p>' : '')+
          '<label class="small">Estado del alta</label>'+
          '<select data-oea="'+e.id+'">'+
            '<option value="en_alta" '+(e.onboarding.alta_estado!=='completada'?'selected':'')+'>En alta</option>'+
            '<option value="completada" '+(e.onboarding.alta_estado==='completada'?'selected':'')+'>Completada</option>'+
          '</select>'+
          (e.onboarding.alta_fecha? '<p class="muted" style="font-size:11px">Actualizado '+fmtFecha(e.onboarding.alta_fecha)+'</p>' : '')+
        '</div>';
      }).join('') : '<p class="muted">Sin proveedores nuevos con QR de alta entregado.</p>');
    el.innerHTML = pendHtml + oeaHtml;
    document.querySelectorAll('[data-oea]').forEach(function(sel){
      sel.onchange = function(){
        var e = all.find(function(x){return x.id===sel.getAttribute('data-oea');});
        if(!e) return;
        e.onboarding.alta_estado = sel.value;
        e.onboarding.alta_fecha = Date.now();
        e.fecha_edicion = Date.now();
        dbPut('encuentros', e, function(){ toast('Alta OEA actualizada ✓'); renderSeguimiento(app); });
      };
    });
  });
}
function wireSeguimiento(){
  /* Todo el cableado de esta pestaña se hace en línea dentro de renderSeguimiento()
     (para el borrador de correo) y por delegación en #app (para el botón "Generar
     correo" y "Volver") — ambos casos porque el contenido se carga async vía
     dbGetAll y no existe todavía en el momento en que se llamaría esta función. */
}

/* ---------- Gastos (Módulo 7) ---------- */
var CONCEPTOS_GASTO = ['Restaurantes','Refrigerios','Transporte','Alojamiento','Muestras','Varios'];
var MONEDAS_GASTO = ['COP','USD','EUR','GBP'];

function nuevoGasto(){
  var hoy = new Date().toISOString().slice(0,10);
  // Por defecto Tarjeta, porque es el medio de pago que más usas — se cambia
  // con un toque cuando el gasto sea en efectivo.
  return { id:uid(), estado:'completo', ciudad:'', fecha:hoy, concepto:CONCEPTOS_GASTO[0],
    beneficiario:'', detalle:'', valor:'', moneda:'COP', metodoPago:'Tarjeta', foto:null,
    fecha_creacion:Date.now(), fecha_edicion:Date.now(), _esNuevo:true };
}
function aplicarFiltroGastos(all){
  var f = STATE.gastoFiltro;
  return all.filter(function(g){
    if(f.concepto && g.concepto!==f.concepto) return false;
    if(f.ciudad && g.ciudad!==f.ciudad) return false;
    if(f.metodoPago && (g.metodoPago||'Tarjeta')!==f.metodoPago) return false;
    if(f.desde && (g.fecha||'') < f.desde) return false;
    if(f.hasta && (g.fecha||'') > f.hasta) return false;
    if(f.texto){
      var t = f.texto.toLowerCase();
      var hay = (g.beneficiario||'').toLowerCase().indexOf(t)>=0 || (g.detalle||'').toLowerCase().indexOf(t)>=0;
      if(!hay) return false;
    }
    return true;
  });
}
function sincronizarGastoFormDesdeDOM(g){
  // Guarda en el objeto lo que el usuario ya haya escrito a mano antes de que
  // termine la lectura automática, para no perderlo al volver a pintar el formulario.
  if(document.getElementById('fCiudad')) g.ciudad = val('fCiudad');
  if(document.getElementById('fFecha')) g.fecha = val('fFecha');
  if(document.getElementById('fConcepto')) g.concepto = val('fConcepto');
  if(document.getElementById('fBeneficiario')) g.beneficiario = val('fBeneficiario');
  if(document.getElementById('fDetalle')) g.detalle = val('fDetalle');
  if(document.getElementById('fValor')) g.valor = val('fValor');
  if(document.getElementById('fMoneda')) g.moneda = val('fMoneda');

function subtotalesPorMoneda(list){
  var out = {};
  list.forEach(function(g){
    var m = g.moneda || '?';
    var v = parseFloat(g.valor) || 0;
    out[m] = (out[m]||0) + v;
  });
  return out;
}
function subtotalesPorMetodoYMoneda(list){
  var out = {};
  list.forEach(function(g){
    var mp = g.metodoPago || 'Tarjeta';
    var mo = g.moneda || '?';
    var v = parseFloat(g.valor) || 0;
    out[mp] = out[mp] || {};
    out[mp][mo] = (out[mp][mo]||0) + v;
  });
  return out;
}
function esCiudadLocal(ciudad){
  return (ciudad||'').trim().toLowerCase().indexOf('medell') === 0;

function wireGastos(){
  if(STATE.gastoForm){
    var g = STATE.gastoForm;
    var fFoto = document.getElementById('fotoGasto');
    if(fFoto) fFoto.onchange = function(){
      if(fFoto.files && fFoto.files[0]) compressImage(fFoto.files[0], function(d){
        g.foto=d; render();
        toast('Leyendo comprobante…', 8000);
        leerComprobanteGasto(d, function(campos){
          var actual = STATE.gastoForm;
          if(!actual || actual.id!==g.id) return; // el usuario canceló o cambió de gasto mientras tanto
          sincronizarGastoFormDesdeDOM(actual);
          if(!campos){ toast('No se pudo leer automáticamente — completa a mano.'); return; }
          actual._ocrTexto = campos.texto_ocr||''; // para el botón "Ver texto leído", por si algún dato quedó mal
          var huboSugerencia = false;
          if(!actual.ciudad && campos.ciudad){ actual.ciudad = campos.ciudad; huboSugerencia = true; }
          if(campos.fecha){ actual.fecha = campos.fecha; huboSugerencia = true; }
          if(!actual.beneficiario && campos.beneficiario){ actual.beneficiario = campos.beneficiario; huboSugerencia = true; }
          if(!actual.valor && campos.monto!=null){ actual.valor = campos.monto; huboSugerencia = true; }
          if(campos.concepto){ actual.concepto = campos.concepto; huboSugerencia = true; }
          // Solo cambia a Efectivo si el comprobante lo dice explícitamente —
          // nunca lo devuelve a Tarjeta (así no pisa una elección tuya).
          if(campos.metodoPago==='Efectivo'){ actual.metodoPago = 'Efectivo'; huboSugerencia = true; }
          toast(huboSugerencia? 'Datos sugeridos — revisa y corrige lo que falte ✓' : 'No se detectaron datos — completa a mano (revisa "Ver texto leído").', 6000);
          render();
        });
      });
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-metodopago]'), function(btn){

    });

      g.beneficiario = val('fBeneficiario'); g.detalle = val('fDetalle');
      g.valor = val('fValor'); g.moneda = val('fMoneda');
      if(!g.ciudad || !g.fecha || !g.valor){ toast('Completa ciudad, fecha y valor.'); return; }
      g.estado = 'completo'; g.fecha_edicion = Date.now(); delete g._esNuevo;
      dbPut('gastos', g, function(){ toast('Gasto guardado ✓'); STATE.gastoForm=null; render(); });
    });
    on('btnBorrarGastoForm', function(){
      customConfirm('¿Eliminar este gasto? No se puede deshacer.', function(){
        dbDelete('gastos', g.id, function(){ toast('Gasto eliminado.'); STATE.gastoForm=null; render(); });
      });
    });
    return;
  }
  on('btnNuevoGasto', function(){ STATE.gastoForm = nuevoGasto(); render(); });
  on('btnLimpiarFiltroGastos', function(){ STATE.gastoFiltro = {concepto:'',ciudad:'',metodoPago:'',desde:'',hasta:'',texto:''}; render(); });
  ['fFiltroConcepto','fFiltroCiudad','fFiltroMetodoPago','fFiltroDesde','fFiltroHasta'].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.onchange = function(){
      STATE.gastoFiltro.concepto = val('fFiltroConcepto');
      STATE.gastoFiltro.ciudad = val('fFiltroCiudad');
      STATE.gastoFiltro.metodoPago = val('fFiltroMetodoPago');
      STATE.gastoFiltro.desde = val('fFiltroDesde');
      STATE.gastoFiltro.hasta = val('fFiltroHasta');
      render();
    };
  });
  var txt2 = document.getElementById('fFiltroTexto');
  if(txt2) txt2.oninput = function(){ STATE.gastoFiltro.texto = txt2.value; render(); };
  on('btnExportGastosPdf', exportarGastosPDF);
  on('btnExportGastosCsv', exportarGastosCSV);
}
function exportarGastosCSV(){
  dbGetAll('gastos', function(all){
    var filtrados = aplicarFiltroGastos(all);
    filtrados.sort(function(a,b){ return (a.fecha||'').localeCompare(b.fecha||''); });
    var rows = [['Fecha','Ciudad','Concepto','Beneficiario','Detalle','Valor','Moneda','Método de pago']];
    filtrados.forEach(function(g){ rows.push([g.fecha||'', g.ciudad||'', g.concepto||'', g.beneficiario||'', g.detalle||'', g.valor||'', g.moneda||'', g.metodoPago||'Tarjeta']); });
    var csv = rows.map(function(r){
      return r.map(function(c){
        var s = (c==null? '' : String(c));
        if(s.indexOf(',')>=0 || s.indexOf('"')>=0 || s.indexOf('\n')>=0){ s = '"'+s.replace(/"/g,'""')+'"'; }
        return s;
      }).join(',');
    }).join('\r\n');
    var blob = new Blob(["\ufeff"+csv], {type:'text/csv;charset=utf-8;'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    var sufijoPago = STATE.gastoFiltro.metodoPago? ('_'+STATE.gastoFiltro.metodoPago) : '';
    a.download = 'Relacion_Gastos'+sufijoPago+'_'+(new Date().toISOString().slice(0,10))+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    toast("Excel (CSV) descargado.");
  });
}
function exportarGastosPDF(){
  toast("Generando PDF…", 4000);
  function withLibs(cb){
    if(window.jspdf && window.html2canvas) return cb();
    var s1=document.createElement('script'); s1.src="./jspdf.umd.min.js";
    var s2=document.createElement('script'); s2.src="./html2canvas.min.js";
    var loaded=0; function done(){ loaded++; if(loaded===2) cb(); }
    s1.onload=done; s2.onload=done;
    s1.onerror=s2.onerror=function(){ toast("Sin señal para generar el PDF — intenta con wifi."); };
    document.head.appendChild(s1); document.head.appendChild(s2);
  }
  withLibs(function(){
    var el = document.getElementById('gastosBody');
    html2canvas(el, {scale:2}).then(function(canvas){
      var img = canvas.toDataURL('image/jpeg', 0.9);
      var pdf = new window.jspdf.jsPDF({unit:'pt', format:'a4'});
      var pageW = pdf.internal.pageSize.getWidth();
      var ratio = pageW / canvas.width;
      var etiquetaPago = STATE.gastoFiltro.metodoPago? (' — '+STATE.gastoFiltro.metodoPago) : '';
      pdf.text("Relación de Gastos"+etiquetaPago+" ("+fmtFecha(Date.now())+")", 24, 24);
      pdf.addImage(img, 'JPEG', 20, 36, canvas.width*ratio-40, canvas.height*ratio-40);
      var sufijoPago = STATE.gastoFiltro.metodoPago? ('_'+STATE.gastoFiltro.metodoPago) : '';
      pdf.save('Relacion_Gastos'+sufijoPago+'_'+(new Date().toISOString().slice(0,10))+'.pdf');
      toast("PDF descargado ✓");
    }).catch(function(){ toast("No se pudo generar el PDF."); });
  });
}

/* ---------- Muestras (Módulo 4 — Consolidación & Muestras) ----------
   Trabaja sobre las telas ya capturadas en cada Encuentro (Módulo 3): cada
   tela nace con su propio sub-objeto `muestra`. No hay un almacén separado —
   la muestra siempre queda ligada a su encuentro/proveedor/tela de origen,
   igual que exige la arquitectura (enlace muestra ↔ precio ↔ línea).
   Flujo: Pendiente recepción → Recibida → Catalogada (precio + línea
   confirmados) → Entregada (dueño + fecha + nota de contexto).
   Incluye además el seguimiento del alta OEA de proveedores nuevos que
   recibieron el QR durante el encuentro (Módulo 3, Paso A1). */
var MUESTRA_ESTADOS = ['pendiente','recibida','catalogada','entregada'];
var MUESTRA_ESTADO_LABEL = {pendiente:'Pendiente recepción', recibida:'Recibida', catalogada:'Catalogada', entregada:'Entregada'};
var MUESTRA_ESTADO_CLASE = {pendiente:'pendiente', recibida:'pendiente', catalogada:'pendiente', entregada:'resuelto'};
var LINEAS_SOURCING = ['Moda','Denim','Institucional','Moda Pesada','Punto'];

function muestrasFlat(encs){
  var out = [];
  encs.forEach(function(e){
    (e.telas||[]).forEach(function(t, ti){
      migrarMuestra(t);
      if(!t.muestra.linea) t.muestra.linea = e.proveedor_linea || '';
      out.push({e:e, t:t, ti:ti});
    });
  });
  return out;
}
function aplicarFiltroMuestras(items){
  var f = STATE.muestraFiltro;
  return items.filter(function(it){
    if(f.proveedor && it.e.proveedor!==f.proveedor) return false;
    if(f.linea && (it.t.muestra.linea||'')!==f.linea) return false;
    if(f.estado && it.t.muestra.estado!==f.estado) return false;
    return true;
  });
}

function viewMuestrasBody(encs){

  items.forEach(function(it){ counts[it.t.muestra.estado] = (counts[it.t.muestra.estado]||0)+1; });

  var proveedores = {}; items.forEach(function(it){ proveedores[it.e.proveedor]=true; });
  var provOpts = ['<option value="">Proveedor: todos</option>'].concat(Object.keys(proveedores).sort().map(function(p){
    return '<option '+(f.proveedor===p?'selected':'')+'>'+escapeHtml(p)+'</option>';
  })).join('');
  var filtrados = aplicarFiltroMuestras(items);

  // Agrupado por proveedor — dentro de cada uno, ordenado por estado.
  var ord = {pendiente:0, recibida:1, catalogada:2, entregada:3};
  var grupos = {}; var ordenProv = [];
  filtrados.forEach(function(it){
    var p = it.e.proveedor;
    if(!grupos[p]){ grupos[p]=[]; ordenProv.push(p); }

  });
  ordenProv.sort(function(a,b){ return a.localeCompare(b); });
  var gruposHtml = ordenProv.map(function(p){
    var lista = grupos[p].slice().sort(function(a,b){ return ord[a.t.muestra.estado]-ord[b.t.muestra.estado]; });
    return '<h3 style="margin-top:18px">'+escapeHtml(p)+'</h3>'+lista.map(viewMuestraCard).join('');
  }).join('');

  return ''+
    '<div class="grid2">'+
      '<div class="card" style="text-align:center"><div style="font-size:22px;font-weight:800;color:var(--navy)">'+(counts.pendiente+counts.recibida+counts.catalogada)+'</div><div class="muted">Muestras por cerrar</div></div>'+
      '<div class="card" style="text-align:center"><div style="font-size:22px;font-weight:800;color:var(--navy)">'+counts.entregada+'</div><div class="muted">Entregadas</div></div>'+
    '</div>'+
    '<div class="card">'+
      '<label class="small">Filtros</label>'+
      '<select id="fMueProveedor">'+provOpts+'</select>'+
      '<div class="grid2">'+
        '<select id="fMueLinea"><option value="">Línea: todas</option>'+LINEAS_SOURCING.map(function(l){return '<option '+(f.linea===l?'selected':'')+'>'+l+'</option>';}).join('')+'</select>'+
        '<select id="fMueEstado"><option value="">Estado: todos</option>'+MUESTRA_ESTADOS.map(function(s){return '<option value="'+s+'" '+(f.estado===s?'selected':'')+'>'+MUESTRA_ESTADO_LABEL[s]+'</option>';}).join('')+'</select>'+
      '</div>'+
      '<button class="ghost" id="btnLimpiarFiltroMuestras" style="font-size:12px">Limpiar filtros</button>'+
    '</div>'+
    (filtrados.length? gruposHtml : '<p class="muted">Sin muestras que coincidan con el filtro.</p>');
}
function renderMuestras(app){
  app.innerHTML = '<h2>Muestras</h2><p class="muted">Agrupadas por proveedor. Recepción, catalogación, precio y entrega con contexto a cada dueño de línea.</p><div id="mueBody"><p class="muted">Cargando…</p></div>';
  dbGetAll('encuentros', function(encs){
    STATE._muestrasEncs = encs;
    var body = document.getElementById('mueBody');
    if(body){ body.innerHTML = viewMuestrasBody(encs); wireMuestras(); }
  });
}
function wireMuestras(){
  on('btnLimpiarFiltroMuestras', function(){
    STATE.muestraFiltro = {proveedor:'', linea:'', estado:''};
    var body = document.getElementById('mueBody');
    if(body){ body.innerHTML = viewMuestrasBody(STATE._muestrasEncs); wireMuestras(); }
  });
  ['fMueProveedor','fMueLinea','fMueEstado'].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.onchange = function(){
      STATE.muestraFiltro.proveedor = val('fMueProveedor');
      STATE.muestraFiltro.linea = val('fMueLinea');
      STATE.muestraFiltro.estado = val('fMueEstado');
      var body = document.getElementById('mueBody');
      if(body){ body.innerHTML = viewMuestrasBody(STATE._muestrasEncs); wireMuestras(); }
    };
  });
  document.querySelectorAll('[data-mf]').forEach(function(el){
    el.oninput = el.onchange = function(){
      var encId = el.getAttribute('data-enc'), ti = +el.getAttribute('data-ti'), field = el.getAttribute('data-mf');
      var e = STATE._muestrasEncs.find(function(x){return x.id===encId;});
      if(!e || !e.telas[ti]) return;
      var t = e.telas[ti];
      var necesitaRerender = false;
      if(field==='precio') t.precio = el.value;
      else if(field==='precio_confirmado') t.muestra.precio_confirmado = (el.value==='1');
      else if(field==='origen') t.muestra.origen = el.value;
      else if(field==='linea') t.muestra.linea = el.value;
      else if(field==='dueno_nombre') t.muestra.dueno_nombre = el.value;
      else if(field==='dueno_linea') t.muestra.dueno_linea = el.value;
      else if(field==='contexto') t.muestra.contexto = el.value;
      else if(field==='estado'){
        t.muestra.estado = el.value;
        if(el.value!=='pendiente' && !t.muestra.fecha_recepcion) t.muestra.fecha_recepcion = Date.now();
        if(el.value==='entregada' && !t.muestra.fecha_entrega) t.muestra.fecha_entrega = Date.now();
        if(el.value!=='entregada') t.muestra.fecha_entrega = null;
        necesitaRerender = true;
      }
      e.fecha_edicion = Date.now();
      dbPut('encuentros', e, function(){
        if(necesitaRerender){
          var body = document.getElementById('mueBody');
          if(body){ body.innerHTML = viewMuestrasBody(STATE._muestrasEncs); wireMuestras(); }
        }
      });
    };
  });
}

/* ---------- Reporte a Gerencia ---------- */
function armarTextoAnalisisReporte(encs, vis, porLinea, actuales, nuevos, ranking){
  var lineas = [];
  lineas.push('REPORTE DE FERIA — datos crudos para análisis');
  lineas.push('');
  lineas.push('1. COBERTURA');
  lineas.push('Total encuentros: '+encs.length+' ('+actuales+' proveedores actuales, '+nuevos+' nuevos)');
  lineas.push('Total visitas a almacén/mercado: '+vis.length);
  Object.keys(porLinea).forEach(function(l){ lineas.push('- '+l+': '+porLinea[l]); });
  lineas.push('');
  lineas.push('2. RECLAMOS');
  var reclamos = encs.filter(function(e){ return e.temas.reclamos.aplica || e.temas.reclamos.resumen || e.temas.reclamos.comentario; });
  lineas.push(reclamos.length? reclamos.map(function(e){ return '- '+e.proveedor+': '+(e.temas.reclamos.resultado||'sin resultado')+' — '+(e.temas.reclamos.comentario||e.temas.reclamos.resumen||''); }).join('\n') : '(sin reclamos registrados)');
  lineas.push('');
  lineas.push('3. COMISIONES');
  var comis = encs.filter(function(e){ return e.temas.comisiones.aplica || e.temas.comisiones.resumen || e.temas.comisiones.comentario; });
  lineas.push(comis.length? comis.map(function(e){ return '- '+e.proveedor+': '+(e.temas.comisiones.resultado||'sin resultado')+' — '+(e.temas.comisiones.comentario||e.temas.comisiones.resumen||''); }).join('\n') : '(sin temas de comisiones registrados)');
  lineas.push('');
  lineas.push('4. HIGHLIGHTS DE PRODUCTO (telas marcadas importantes)');
  lineas.push(ranking.length? ranking.map(function(r){ return '- '+r.prov+': '+(r.ref||'sin ref.')+(r.precio?' — '+r.precio:''); }).join('\n') : '(ninguna tela marcada como importante todavía)');
  lineas.push('');
  lineas.push('5. HALLAZGOS Y PENDIENTES POR PROVEEDOR');
  var notas = encs.filter(function(e){ return e.hallazgos_stand || e.otros_pendientes; });
  lineas.push(notas.length? notas.map(function(e){
    var p=[]; if(e.hallazgos_stand) p.push('Hallazgos: '+e.hallazgos_stand); if(e.otros_pendientes) p.push('Pendientes: '+e.otros_pendientes);
    return '- '+e.proveedor+' — '+p.join(' | ');
  }).join('\n') : '(sin notas registradas)');
  lineas.push('');
  lineas.push('6. TENDENCIAS DE MERCADO (visitas a almacén/tiendas)');
  var prendas = [];
  vis.forEach(function(v){ v.prendas.forEach(function(p){ if(p.linea||p.tela_inferida) prendas.push({marca:v.marca, ubicacion:v.ubicacion, linea:p.linea, tela:p.tela_inferida}); }); });
  lineas.push(prendas.length? prendas.map(function(p){ return '- '+p.marca+' ('+(p.ubicacion||'')+'): '+[p.linea,p.tela].filter(Boolean).join(' — '); }).join('\n') : '(sin prendas de mercado registradas)');
  lineas.push('');
  lineas.push('---');
  lineas.push('INSTRUCCIÓN: con esta información, redacta un resumen ejecutivo cuantitativo y cualitativo de la feria, con la perspectiva de un director de Sourcing, para presentar a Gerencia.');
  return lineas.join('\n');
}

/* Orden alfanumérico simple para Hall/Stand (ej: "A2" antes que "A10") —
   sin esto, un sort de texto normal pondría "A10" antes que "A2". */
function compareAlfaNum(a,b){
  a=(a||''); b=(b||'');
  var ax = a.match(/^(\D*)(\d*)/) || ['','',''];
  var bx = b.match(/^(\D*)(\d*)/) || ['','',''];
  var aLetras=(ax[1]||'').toLowerCase(), bLetras=(bx[1]||'').toLowerCase();
  if(aLetras!==bLetras) return aLetras<bLetras? -1 : 1;
  var aNum=parseInt(ax[2],10), bNum=parseInt(bx[2],10);
  aNum=isNaN(aNum)?0:aNum; bNum=isNaN(bNum)?0:bNum;
  return aNum-bNum;
}

      }).join('')+

    // El cuadro de texto crece solo hasta mostrar TODO el contenido, sin
    // scroll interno — pensado para poder tomar captura de pantalla completa
    // de cada línea sin que se corte nada. Se recalcula también mientras
    // Luis escribe, y de nuevo al cargar el resumen del Brief (que cambia el
    // contenido sin pasar por el evento "input").
    function autoAjustarObjetivo(ta){
      ta.style.height = 'auto';
      ta.style.height = (ta.scrollHeight+2) + 'px';
    }
    var areasObjetivo = objBox.querySelectorAll('.objetivo-auto');
    areasObjetivo.forEach(function(ta){

      ta.addEventListener('input', function(){ autoAjustarObjetivo(ta); });

    objBox.querySelectorAll('[data-cargarbrief]').forEach(function(btn){
      btn.onclick = function(){
        var linea = btn.getAttribute('data-cargarbrief');

        if(!ta) return;
        if(ta.value.trim()){
          customConfirm('Ya hay texto escrito en '+linea+'. ¿Reemplazarlo con el resumen del Brief 2027?', function(){
            ta.value = BRIEF_2027_RESUMEN[linea];
            autoAjustarObjetivo(ta);
          });
        } else {
          ta.value = BRIEF_2027_RESUMEN[linea];
          autoAjustarObjetivo(ta);
        }
      };
    });
    var btnObj = document.getElementById('btnGuardarObjetivos');
    if(btnObj) btnObj.onclick = function(){
      var pend = LINEAS_SOURCING.length;
      if(!pend){ toast('Objetivos guardados ✓'); return; }
      LINEAS_SOURCING.forEach(function(linea){

        rec.texto = ta? ta.value : '';

function exportarExpositoresCSV(){
  var feria = feriaActivaTexto();
  dbGetAll('planeacion', function(all){
    var exps = all.filter(function(x){ return x.tipo==='expositor' && x.feria===feria; });
    exps.sort(function(a,b){
      var h = compareAlfaNum(a.hall,b.hall); if(h!==0) return h;
      return compareAlfaNum(a.stand,b.stand);
    });
    var rows = [['Feria','Nombre','Hall','Stand','Prioridad','Colección nueva','Visitado']];
    exps.forEach(function(x){
      rows.push([x.feria||'', x.nombre||'', x.hall||'', x.stand||'', x.prioridad||'', x.coleccion_nueva?'Sí':'No', x.visitado?'Sí':'No']);
    });
    var csv = rows.map(function(r){
      return r.map(function(c){
        var s = (c==null? '' : String(c));
        if(s.indexOf(',')>=0 || s.indexOf('"')>=0 || s.indexOf('\n')>=0){ s = '"'+s.replace(/"/g,'""')+'"'; }
        return s;
      }).join(',');
    }).join('\r\n');
    var blob = new Blob(["﻿"+csv], {type:'text/csv;charset=utf-8;'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Expositores_'+slug(feria)+'_'+(new Date().toISOString().slice(0,10))+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    toast("Excel (CSV) descargado.");
  });
}

/* ---------- Dossier de Viaje & Logística (Módulo 2) ----------
   Store IndexedDB nuevo `dossier`, con dos tipos de registro distinguidos
   por `tipo`: 'reserva' (vuelo, hotel, tren, pase, metro, restaurante,
   espectáculo — con documento/foto adjunta opcional) e 'itinerario'
   (actividad de un día: trabajo, comida, nocturno, traslado).
   Cada registro lleva su propio campo `viaje` (texto libre, ej. "París —
   sep 2026", "Shanghai — ago 2026") — no depende de #feriaActiva porque
   aquí puede haber varios viajes organizándose en paralelo. La vista
   agrupa todo por viaje en vez de forzar a elegir uno solo primero. */
var CATEGORIAS_RESERVA = ['Vuelo','Hotel','Tren','Pase/Entrada','Transporte local','Restaurante','Espectáculo','Otro'];
var TIPOS_ITINERARIO = ['Trabajo','Comida','Nocturno','Traslado','Otro'];
var TIPO_ITIN_CLASE = {Trabajo:'pendiente', Comida:'resuelto', Nocturno:'confuso', Traslado:'pendiente', Otro:'pendiente'};
function nuevaReserva(viaje){
  return { id:uid(), tipo:'reserva', viaje:viaje||'', categoria:CATEGORIAS_RESERVA[0],
    titulo:'', fecha:'', hora:'', lugar:'', confirmacion:'', notas:'', documento:null,
    fecha_creacion:Date.now(), fecha_edicion:Date.now() };
}
function nuevoItinerario(viaje){
  return { id:uid(), tipo:'itinerario', viaje:viaje||'', fecha:'', hora:'',
    actividad:TIPOS_ITINERARIO[0], descripcion:'', lugar:'',
    fecha_creacion:Date.now(), fecha_edicion:Date.now() };
}
function dossierViajesDistintos(all){
  var s = {};
  all.forEach(function(x){ if(x.viaje) s[x.viaje]=true; });
  return Object.keys(s).sort();
}
function copiarTextoPlano(texto, onOk){
  function fallback(){
    var tmp = document.createElement('textarea'); tmp.value = texto;
    tmp.style.position='fixed'; tmp.style.opacity='0'; document.body.appendChild(tmp);
    tmp.focus(); tmp.select();
    try{ document.execCommand('copy'); onOk(); }
    catch(err){ toast('No se pudo copiar automáticamente — selecciona el texto a mano.'); }
    document.body.removeChild(tmp);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(onOk).catch(fallback);
  } else fallback();
}
function generarResumenViaje(viaje, itins, reservas){
  var out = 'DOSSIER DE VIAJE — '+viaje+'\n';
  out += '='.repeat(('DOSSIER DE VIAJE — '+viaje).length)+'\n\n';
  out += 'ITINERARIO\n';
  if(!itins.length) out += '(sin actividades registradas)\n';
  else {
    var porFecha = {};
    itins.forEach(function(it){ var f=it.fecha||'Sin fecha'; (porFecha[f]=porFecha[f]||[]).push(it); });
    Object.keys(porFecha).sort().forEach(function(f){
      out += '\n'+f+'\n';
      porFecha[f].sort(function(a,b){ return (a.hora||'').localeCompare(b.hora||''); }).forEach(function(it){
        out += '  '+(it.hora||'--:--')+' ['+it.actividad+'] '+it.descripcion+(it.lugar? ' — '+it.lugar : '')+'\n';
      });
    });
  }
  out += '\nRESERVAS Y DOCUMENTOS\n';
  if(!reservas.length) out += '(sin reservas registradas)\n';
  else {
    reservas.slice().sort(function(a,b){ return (a.fecha||'').localeCompare(b.fecha||'') || (a.hora||'').localeCompare(b.hora||''); }).forEach(function(r){
      out += '\n['+r.categoria+'] '+r.titulo+'\n';
      if(r.fecha || r.hora) out += '  Fecha/hora: '+(r.fecha||'—')+' '+(r.hora||'')+'\n';
      if(r.lugar) out += '  Lugar: '+r.lugar+'\n';
      if(r.confirmacion) out += '  Confirmación: '+r.confirmacion+'\n';
      if(r.notas) out += '  Notas: '+r.notas+'\n';
    });
  }
  return out;
}

/* ---------- Exportar / respaldo ---------- */
/* Construye el texto de respaldo (todas las tablas) una sola vez —
   lo usan tanto la descarga de archivo (exportarJSON) como copiar al
   portapapeles (copiarRespaldoTexto), para no repetir la lógica. */
function construirRespaldoTexto(cb){
  dbGetAll('encuentros', function(encs){
    dbGetAll('visitas', function(vis){
      dbGetAll('gastos', function(gas){
        dbGetAll('planeacion', function(plan){
          dbGetAll('dossier', function(doss){
            var data = {version:4, exportado:Date.now(), encuentros:encs, visitas:vis, gastos:gas, planeacion:plan, dossier:doss};
            cb(JSON.stringify(data));
          });
        });
      });
    });
  });
}
function exportarJSON(){
  construirRespaldoTexto(function(texto){
    var blob = new Blob([texto], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ferias_respaldo_'+(new Date().toISOString().slice(0,10))+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    toast("Respaldo descargado.");
  });
}
/* Copiar al portapapeles — alternativa a la descarga de archivo, para
   visores (como Documents/Readdle con "Block external links" activo)
   que bloquean la descarga por blob. Usa la misma técnica que ya
   funciona en el Foco Semanal: textarea temporal + execCommand('copy'). */
function copiarRespaldoTexto(){
  construirRespaldoTexto(function(texto){
    var ta = document.createElement('textarea');
    ta.value = texto;
    ta.style.position='fixed'; ta.style.top='-9999px'; ta.style.left='-9999px';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    var ok=false;
    try{ ok = document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    if(ok) toast("Respaldo copiado — pégalo en un WhatsApp o correo a ti mismo.", 3500);
    else toast("No se pudo copiar automáticamente. Mantén presionado el cuadro de abajo y copia a mano.", 4000);
    mostrarTextoRespaldoManual(texto, !ok);
  });
}
/* Deja el texto visible y seleccionable como respaldo del respaldo —
   si el copiado automático falla, Luis lo selecciona a mano (toque
   largo → Seleccionar todo → Copiar). */
function mostrarTextoRespaldoManual(texto, forzarVisible){
  var box = document.getElementById('respaldoTextoBox');
  if(!box) return;
  box.classList.remove('hidden');
  box.querySelector('textarea').value = texto;
  if(forzarVisible) box.querySelector('textarea').focus();
}
function restaurarDatos(jsonText, onDone){
  try{
    var data = JSON.parse(jsonText);
    (data.encuentros||[]).forEach(function(x){ dbPut('encuentros', x); });
    (data.visitas||[]).forEach(function(x){ dbPut('visitas', x); });
    (data.gastos||[]).forEach(function(x){ dbPut('gastos', x); });
    (data.planeacion||[]).forEach(function(x){ dbPut('planeacion', x); });
    (data.dossier||[]).forEach(function(x){ dbPut('dossier', x); });
    toast("Respaldo importado ✓"); onDone&&onDone(true); setView('home');
  }catch(err){ toast("Ese texto/archivo no es un respaldo válido."); onDone&&onDone(false); }
}
function importarJSON(file){
  var reader = new FileReader();
  reader.onload = function(e){ restaurarDatos(e.target.result); };
  reader.readAsText(file);
}

/* ---------- PDF (foto del momento) ---------- */
function exportarPDF(){
  toast("Generando PDF…", 4000);
  function withLibs(cb){
    if(window.jspdf && window.html2canvas) return cb();
    var s1=document.createElement('script'); s1.src="./jspdf.umd.min.js";
    var s2=document.createElement('script'); s2.src="./html2canvas.min.js";
    var loaded=0; function done(){ loaded++; if(loaded===2) cb(); }
    s1.onload=done; s2.onload=done;
    s1.onerror=s2.onerror=function(){ toast("Sin señal para generar el PDF — intenta con wifi."); };
    document.head.appendChild(s1); document.head.appendChild(s2);
  }
  withLibs(function(){
    var el = document.getElementById('repBody');
    html2canvas(el, {scale:2}).then(function(canvas){
      var img = canvas.toDataURL('image/jpeg', 0.9);
      var pdf = new window.jspdf.jsPDF({unit:'pt', format:'a4'});
      var pageW = pdf.internal.pageSize.getWidth();
      var ratio = pageW / canvas.width;
      pdf.text("Reporte a Gerencia — Ferias ("+fmtFecha(Date.now())+")", 24, 24);
      pdf.addImage(img, 'JPEG', 20, 36, canvas.width*ratio-40, canvas.height*ratio-40);
      pdf.save('Reporte_Ferias_'+(new Date().toISOString().slice(0,10))+'.pdf');
      toast("PDF descargado ✓");
    }).catch(function(){ toast("No se pudo generar el PDF."); });
  });
}
