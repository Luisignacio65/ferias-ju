/* ---------- Delegación global: abrir/editar un registro desde "Ver registros" ----------
   Se ancla a #app (que nunca se destruye) en vez de a las tarjetas individuales,
   para que funcione sin importar cuándo termine de cargar la lista (carga async). */
document.getElementById('app').addEventListener('click', function(ev){
  /* Ampliar cualquier foto marcada como "zoomable" (telas, prendas, fotos de
     contexto, comprobantes de gastos) — un solo visor para toda la app, así
     que se revisa primero y no interfiere con ningún otro data-* de abajo. */
  var imgZoom = ev.target.closest('img.zoomable');
  if(imgZoom){ abrirLightbox(imgZoom.getAttribute('src')); return; }
  /* Eliminar un Encuentro o Visita desde Registros (Módulo 4) — se revisa ANTES
     que data-edit porque el botón de borrar vive dentro de la misma tarjeta
     que abre el registro; si no se revisa primero, tocar "Eliminar" también
     abriría el registro por el clic que sube (bubbling) hasta la tarjeta. */
  var itDelReg = ev.target.closest('[data-delreg]');
  if(itDelReg){
    var tipoDel = itDelReg.getAttribute('data-delreg');
    var idDel = itDelReg.getAttribute('data-id');
    var nombre = tipoDel==='encuentros'? 'encuentro' : 'visita';
    customConfirm('¿Eliminar este '+nombre+'? No se puede deshacer.', function(){
      dbDelete(tipoDel, idDel, function(){
        toast((tipoDel==='encuentros'? 'Encuentro' : 'Visita')+' eliminado.');
        render();
      });
    });
    return;
  }
  var it = ev.target.closest('[data-edit]');
  if(it){
    var tipo = it.getAttribute('data-edit'), id = it.getAttribute('data-id');
    dbGetAll(tipo, function(all){
      var found = all.find(function(x){ return String(x.id)===String(id); });
      if(!found) return;
      if(tipo==='encuentros'){ STATE.enc=found; STATE.encStep=0; setView('encuentro'); }
      else { STATE.vis=found; STATE.visStep=0; setView('almacen'); }
    });
    return;
  }
  /* Botón "Generar correo" de Seguimiento (Módulo 5) — misma razón: la lista se
     carga async (dbGetAll) y el botón no existe todavía cuando corre wireSeguimiento().
     Se delega al contenedor #app, que nunca se destruye. */
  var itCorreo = ev.target.closest('[data-correo]');
  if(itCorreo){
    var idc = itCorreo.getAttribute('data-correo');
    dbGetAll('encuentros', function(all){
      var e = all.find(function(x){ return String(x.id)===String(idc); });
      if(!e) return;
      var d = generarCorreoTexto(e);
      STATE.correoId = e.id; STATE.correoAsunto = d.subject; STATE.correoCuerpo = d.body; STATE.correoEmail = d.email;
      render();
    });
    return;
  }
  var itVolver = ev.target.closest('#btnVolverSeg');
  if(itVolver){ STATE.correoId=null; render(); return; }
  /* Editar/eliminar un gasto (Módulo 7) — mismo motivo: la lista de #gastosBody
     se llena async, así que se delega al contenedor #app. */
  var itEditG = ev.target.closest('[data-editgasto]');
  if(itEditG){
    var idg = itEditG.getAttribute('data-editgasto');
    dbGetAll('gastos', function(all){
      var g = all.find(function(x){ return String(x.id)===String(idg); });
      if(!g) return;
      STATE.gastoForm = g; render();
    });
    return;
  }
  var itDelG = ev.target.closest('[data-delgasto]');
  if(itDelG){
    var idd = itDelG.getAttribute('data-delgasto');
    customConfirm('¿Eliminar este gasto? No se puede deshacer.', function(){
      dbDelete('gastos', idd, function(){ toast('Gasto eliminado.'); render(); });
    });
    return;
  }
  /* Planeación & Brief (Módulo 1) — expositores: la lista se llena async
     (dbGetAll), así que igual que en Gastos/Registros, la única forma
     confiable de engancharle clics es delegando al contenedor #app. */
  var itToggPrio = ev.target.closest('[data-toggleprio]');
  if(itToggPrio){
    var idTp = itToggPrio.getAttribute('data-toggleprio');
    dbGetAll('planeacion', function(all){
      var x = all.find(function(r){ return String(r.id)===String(idTp); }); if(!x) return;
      x.prioridad = x.prioridad==='infaltable'? 'secundario' : 'infaltable';
      x.fecha_edicion = Date.now();
      dbPut('planeacion', x, function(){ render(); });
    });
    return;
  }
  var itToggNueva = ev.target.closest('[data-togglenueva]');
  if(itToggNueva){
    var idTn = itToggNueva.getAttribute('data-togglenueva');
    dbGetAll('planeacion', function(all){
      var x = all.find(function(r){ return String(r.id)===String(idTn); }); if(!x) return;
      x.coleccion_nueva = !x.coleccion_nueva;
      x.fecha_edicion = Date.now();
      dbPut('planeacion', x, function(){ render(); });
    });
    return;
  }
  var itToggVis = ev.target.closest('[data-togglevisitado]');
  if(itToggVis){
    var idTv = itToggVis.getAttribute('data-togglevisitado');
    dbGetAll('planeacion', function(all){
      var x = all.find(function(r){ return String(r.id)===String(idTv); }); if(!x) return;
      x.visitado = !x.visitado;
      x.fecha_edicion = Date.now();
      dbPut('planeacion', x, function(){ render(); });
    });
    return;
  }
  var itEditExp = ev.target.closest('[data-editexp]');
  if(itEditExp){
    var idEe = itEditExp.getAttribute('data-editexp');
    dbGetAll('planeacion', function(all){
      var x = all.find(function(r){ return String(r.id)===String(idEe); }); if(!x) return;
      STATE.planExpForm = x; render();
    });
    return;
  }
  var itDelExp = ev.target.closest('[data-delexp]');
  if(itDelExp){
    var idDe = itDelExp.getAttribute('data-delexp');
    customConfirm('¿Eliminar este expositor? No se puede deshacer.', function(){
      dbDelete('planeacion', idDe, function(){ toast('Expositor eliminado.'); render(); });
    });
    return;
  }
  /* Dossier de Viaje (Módulo 2) — reservas e itinerario: mismas razones de
     delegación que arriba (listas cargadas async vía dbGetAll). */
  var itEditRes = ev.target.closest('[data-editres]');
  if(itEditRes){
    var idErx = itEditRes.getAttribute('data-editres');
    dbGetAll('dossier', function(all){
      var x = all.find(function(r){ return String(r.id)===String(idErx); }); if(!x) return;
      STATE.dossierForm = x; render();
    });
    return;
  }
  var itDelRes = ev.target.closest('[data-delres]');
  if(itDelRes){
    var idDrx = itDelRes.getAttribute('data-delres');
    customConfirm('¿Eliminar esta reserva? No se puede deshacer.', function(){
      invalidarResumenDossier();
      dbDelete('dossier', idDrx, function(){ toast('Reserva eliminada.'); render(); });
    });
    return;
  }
  var itEditItin = ev.target.closest('[data-edititin]');
  if(itEditItin){
    var idEix = itEditItin.getAttribute('data-edititin');
    dbGetAll('dossier', function(all){
      var x = all.find(function(r){ return String(r.id)===String(idEix); }); if(!x) return;
      STATE.dossierItinForm = x; render();
    });
    return;
  }
  var itDelItin = ev.target.closest('[data-delitin]');
  if(itDelItin){
    var idDix = itDelItin.getAttribute('data-delitin');
    customConfirm('¿Eliminar esta actividad? No se puede deshacer.', function(){
      invalidarResumenDossier();
      dbDelete('dossier', idDix, function(){ toast('Actividad eliminada.'); render(); });
    });
    return;
  }
  var itGenRes = ev.target.closest('[data-genresumen]');
  if(itGenRes){
    var viajeGen = itGenRes.getAttribute('data-genresumen');
    dbGetAll('dossier', function(all){
      var itins = all.filter(function(x){ return x.tipo==='itinerario' && x.viaje===viajeGen; });
      var reservas = all.filter(function(x){ return x.tipo==='reserva' && x.viaje===viajeGen; });
      STATE.dossierResumenViaje = viajeGen;
      STATE.dossierResumenTexto = generarResumenViaje(viajeGen, itins, reservas);
      render();
    });
    return;
  }
  var itCopyRes = ev.target.closest('[data-copyresumen]');
  if(itCopyRes){
    var viajeCopy = itCopyRes.getAttribute('data-copyresumen');
    var taR = document.getElementById('taResumen_'+viajeCopy);
    var texto = taR? taR.value : STATE.dossierResumenTexto;
    copiarTextoPlano(texto, function(){ toast('Resumen copiado ✓'); });
    return;
  }
});

/* ---------- Evitar que el teclado tape los botones de navegación (tapa la navbar mientras se escribe) ---------- */
document.addEventListener('focusin', function(e){
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) document.body.classList.add('kb-open');
});
document.addEventListener('focusout', function(e){
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){
    autoguardarBorrador(); // guarda lo escrito apenas sales del campo, sin esperar a ningún botón
    setTimeout(function(){
      var a = document.activeElement;
      if(!a || !/INPUT|TEXTAREA|SELECT/.test(a.tagName)) document.body.classList.remove('kb-open');
    }, 50);
  }
});

/* ---------- Recuperar el borrador más reciente si la app se recargó ----------
   Si el celular descargó la app en segundo plano y se perdió la memoria en
   curso, esto trae de vuelta el último encuentro/visita sin terminar
   (guardado por autoguardarBorrador) en el mismo paso donde quedó. */
function recuperarBorradores(cb){
  dbGetAll('encuentros', function(all){
    var b = all.filter(function(x){return x.estado==='borrador';})
                .sort(function(a,c){return c.fecha_edicion-a.fecha_edicion;})[0];
    if(b){ STATE.enc = b; STATE.encStep = b._paso||0; }
    dbGetAll('visitas', function(allv){
      var bv = allv.filter(function(x){return x.estado==='borrador';})
                    .sort(function(a,c){return c.fecha_edicion-a.fecha_edicion;})[0];
      if(bv){ STATE.vis = bv; STATE.visStep = bv._paso||0; }
      cb();
    });
  });
}

/* ---------- Espacio inferior dinámico (evita que el menú tape botones) ----------
   Antes se reservaba un número fijo de píxeles (200px) al final de la página,
   adivinado a ojo. El problema real es que ese número no alcanza a cubrir la
   combinación de: la barra inferior de esta app + la barra propia de la app
   que la contiene (ej. Documents) + el "safe area" del iPhone — y esa
   combinación cambia según el dispositivo y el visor.
   Solución de raíz: en vez de adivinar, se MIDE la altura real de la barra
   inferior de esta app (.navbar) en cada carga y cada vez que cambia el
   tamaño visible de la pantalla, y se reserva esa altura medida + un margen
   de seguridad. Como esto corre solo, en un único lugar, cualquier pestaña
   nueva que se agregue queda protegida automáticamente — no hay que tocar
   esto de nuevo por cada pantalla nueva. */
function ajustarEspacioNavbar(){
  var nb = document.querySelector('.navbar');
  if(!nb) return;
  var h = nb.getBoundingClientRect().height;
  if(h<=0) return;
  var nuevo = (h + 56) + 'px';
  /* Solo se toca el estilo si el valor realmente cambió — así no se genera
     un recálculo de la página en cada evento, que era lo que hacía "brincar"
     el menú al tocar la pantalla. */
  if(document.body.style.paddingBottom !== nuevo) document.body.style.paddingBottom = nuevo;
}
/* Solo se recalcula ante cambios reales de tamaño (rotar el celular, o que
   aparezca/desaparezca el teclado o una barra de la app contenedora) — NUNCA
   durante el scroll, que dispara decenas de eventos por segundo y causaba
   el brinco del menú al tocar/deslizar la pantalla. */
window.addEventListener('resize', ajustarEspacioNavbar);
window.addEventListener('orientationchange', function(){ setTimeout(ajustarEspacioNavbar, 300); });
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', ajustarEspacioNavbar);
}

/* ---------- Clave de acceso ----------
   Filtro simple para que el link no quede abierto a cualquiera que lo
   reciba — no es seguridad bancaria, es una traba básica. La clave se
   guarda en sessionStorage: se pide una vez por apertura de la app (si
   cierras Safari del todo y la vuelves a abrir, la vuelve a pedir). */
(function(){
  var CLAVE_ACCESO = "1965"; // <-- cambia esta clave aquí cuando quieras
  function intentar(){
    var v = (document.getElementById('lockPin').value||'').trim();
    if(v === CLAVE_ACCESO){
      try{ sessionStorage.setItem('feriasUnlocked','1'); }catch(e){}
      document.body.classList.add('unlocked');
    } else {
      document.getElementById('lockErr').style.display='block';
      document.getElementById('lockPin').value='';
      document.getElementById('lockPin').focus();
    }
  }
  document.getElementById('lockBtn').onclick = intentar;
  document.getElementById('lockPin').addEventListener('keydown', function(e){ if(e.key==='Enter') intentar(); });
  try{ if(sessionStorage.getItem('feriasUnlocked')==='1') document.body.classList.add('unlocked'); }catch(e){}
})();

/* ---------- Arranque ---------- */
(function init(){
  try{ if(localStorage.getItem('ferias_tema')==='noche'){ document.body.classList.add('noche'); document.getElementById('btnNoche').textContent='☀️'; } }catch(e){}
  actualizarRed();
  ajustarEspacioNavbar();
  openDB(function(){ recuperarBorradores(function(){ render(); ajustarEspacioNavbar(); }); });
  document.getElementById('lightboxClose').onclick = cerrarLightbox;
  document.getElementById('lightboxOverlay').onclick = cerrarLightbox;
})();

/* ---------- Modo sin internet (service worker) ----------
   Guarda una copia de la app en el celular la primera vez que se abre con
   wifi/datos, para que funcione sin internet después (feria, avión, país
   con restricciones de red como China). Los datos capturados no dependen
   de esto — viven aparte, en IndexedDB. */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
